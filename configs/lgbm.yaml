name: lgbm_l1_log
model: lightgbm
seed: 2026
target_transform: log1p
use_cat: true
save_oof: true
cv_val_months: [[2025, 2], [2024, 12], [2024, 9], [2024, 3]]
cv_fold_weights: [3.0, 2.0, 1.0, 3.0]   # 2024-03 диагностика, не учитывается
fold_iter_use_weights_gt: 0.5
seed_bag: [2026]
winsorize_quantile: 0.999
params:
  objective: regression_l1
  metric: mae
  learning_rate: 0.03
  # Более жёсткая регуляризация под широкий feature space
  num_leaves: 95
  min_data_in_leaf: 80
  feature_fraction: 0.8
  bagging_fraction: 0.85
  bagging_freq: 1
  lambda_l1: 0.1
  lambda_l2: 1.5
  num_boost_round: 12000
  early_stopping_rounds: 300
  num_threads: 4
  verbose: -1