name: lgbm_baseline
model: lightgbm
seed: 2026
target_transform: log1p
use_cat: true
save_oof: true
cv_val_months: [[2025, 2], [2025, 1], [2024, 12], [2024, 3]]
params:
  objective: regression_l1
  metric: mae
  learning_rate: 0.05
  num_leaves: 127
  min_data_in_leaf: 40
  feature_fraction: 0.85
  bagging_fraction: 0.85
  bagging_freq: 1
  lambda_l2: 1.0
  num_boost_round: 8000
  early_stopping_rounds: 250
  num_threads: 4
  verbose: -1