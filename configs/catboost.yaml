name: cat_l1_log
model: catboost
seed: 2026
target_transform: log1p
use_cat: true
save_oof: true
cv_val_months: [[2025, 2], [2024, 12], [2024, 9], [2024, 3]]
cv_fold_weights: [3.0, 1.5, 1.0, 2.0]
fold_iter_use_weights_gt: 0.5
final_iter_multiplier: 1.10
seed_bag: [2026, 41, 777]
winsorize_quantile: 0.999
sanity_cap_up: 2.0
sanity_cap_down: 0.5
apply_sanity_cap_in_cv: true
params:
  loss_function: MAE
  eval_metric: MAE
  learning_rate: 0.04
  depth: 7
  l2_leaf_reg: 4.0
  random_strength: 1.0
  iterations: 10000
  od_type: Iter
  od_wait: 300
  thread_count: 4
  verbose: false
