name: lgbm_mape_weight
model: lightgbm
seed: 2026
target_transform: none
use_cat: true
save_oof: true
mape_weights: true
cv_val_months: [[2025, 2], [2024, 12], [2024, 9], [2024, 3]]
cv_fold_weights: [3.0, 1.5, 1.0, 2.0]
fold_iter_use_weights_gt: 0.5
final_iter_multiplier: 1.10
seed_bag: [2026, 41, 777]
winsorize_quantile: 0.999
sanity_cap_up: 2.0
sanity_cap_down: 0.5
apply_sanity_cap_in_cv: true
params:
  objective: regression_l1
  metric: mape
  learning_rate: 0.03
  num_leaves: 95
  min_data_in_leaf: 80
  feature_fraction: 0.8
  bagging_fraction: 0.85
  bagging_freq: 1
  lambda_l1: 0.1
  lambda_l2: 1.0
  num_boost_round: 12000
  early_stopping_rounds: 300
  num_threads: 4
  verbose: -1
